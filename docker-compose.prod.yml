version: '3.8'

services:
  # 1. Production PostgreSQL Database Cluster
  houseilla-db:
    image: postgres:16-alpine
    container_name: houseilla-db
    ports:
      # Secure: Only allows internal connections from the host/containers
      - "127.0.0.1:5432:5432"
    restart: always
    environment:
      POSTGRES_DB: houseilladb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - houseilla-network

  # 2. Production Ready Java Application
  houseilla-backend:
    build:
      context: ./houseilla-backend
      dockerfile: Dockerfile
    container_name: houseilla-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod  # Activates your PostgreSQL properties profile config
      - DB_HOST=houseilla-db
      - DB_PORT=5432
      - DB_NAME=houseilladb
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - houseilla-db
    networks:
      - houseilla-network

  # 3. High Performance Frontend Nginx Router
  houseilla-frontend:
    build:
      context: ./houseilla-frontend    # Passes your frontend multi-stage context block cleanly!
      dockerfile: Dockerfile
    container_name: houseilla-frontend
    restart: always
    ports:
      - "80:80"    # For HTTP redirection
      - "443:443"  # For HTTPS production SSL traffic
    volumes:
      # Overrides the internal Nginx configuration with the production SSL file layer
      - ./houseilla-frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Mounts your host droplet's active Let's Encrypt SSL certificates dynamically
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - houseilla-backend
    networks:
      - houseilla-network

networks:
  houseilla-network:
    driver: bridge

volumes:
  postgres-prod-data:
    name: houseilla-postgres-storage
